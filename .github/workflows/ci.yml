name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted only, never self-hosted: pull requests to a public
    # repository can come from anyone's fork.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.308

      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/unio

      - name: Lint every script as POSIX sh
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -s sh

      - name: Check the contract fixture
        run: python3 -I tests/check_fixture.py

      - name: Run the scripts against a fake API under dash
        run: dash tests/run.sh

      - name: Run the scripts against a fake API under bash
        run: bash tests/run.sh

      - name: Check the version rules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            sh tests/check_versions.sh "origin/$BASE_REF"
          else
            sh tests/check_versions.sh
          fi

  scripts-macos:
    # The scripts and the installer under macOS's own sh (bash 3.2 in POSIX
    # mode) and BSD sed, awk, find and stty, which differ from Linux's.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the scripts against a fake API under sh
        run: /bin/sh tests/run.sh

      - name: Run the scripts against a fake API under bash
        run: /bin/bash tests/run.sh

  session:
    # A real Claude Code session with the plugin, on each system the plugin
    # supports, against fake Anthropic and Unio APIs on loopback: no secret
    # is used and nothing leaves the runner. Only this proves that the hook,
    # the commands and the MCP header helper run there.
    name: session (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      CLAUDE_CODE_VERSION: "2.1.309"
    steps:
      # Git for Windows' default: checkouts get CRLF line ends unless
      # .gitattributes says otherwise, and sh cannot run a CRLF script.
      - name: Check out with Git for Windows' line ends
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code (macOS, Linux)
        if: runner.os != 'Windows'
        run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:CLAUDE_CODE_VERSION'

      - name: Run a session (macOS, Linux)
        if: runner.os != 'Windows'
        run: python3 -I tests/e2e/claude_session.py --claude "$HOME/.local/bin/claude"

      - name: Run a session (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -I tests/e2e/claude_session.py --claude "$env:USERPROFILE\.local\bin\claude.exe"

  runner:
    # The answering service and its setup on each system it supports.
    # GitHub-hosted only, as above.
    name: runner (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the runner's tests
        run: python -m unittest discover -s runner/tests -v

      - name: Lint bin/unio as POSIX sh
        if: runner.os == 'Linux'
        run: shellcheck -s sh bin/unio

      - name: Verify the systemd unit setup writes
        if: runner.os == 'Linux'
        run: |
          unit="$RUNNER_TEMP/unio-runner@org_ci.service"
          python runner/tests/runner_support.py render systemd "$unit"
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze --user verify "$unit"
          else
            echo "systemd-analyze is not installed here; skipped"
          fi

      - name: Lint the launchd plist setup writes
        if: runner.os == 'macOS'
        run: |
          plist="$RUNNER_TEMP/so.unio.runner.org_ci.plist"
          python runner/tests/runner_support.py render launchd "$plist"
          plutil -lint "$plist"

      - name: Create, query and delete the scheduled task setup writes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $xml = Join-Path $env:RUNNER_TEMP 'unio-runner-task.xml'
          python runner/tests/runner_support.py render schtasks $xml
          if ($LASTEXITCODE) { exit 1 }
          schtasks /Create /TN 'Unio Runner org_ci' /XML $xml /F
          if ($LASTEXITCODE) { exit 1 }
          schtasks /Query /TN 'Unio Runner org_ci' /V /FO LIST
          if ($LASTEXITCODE) { exit 1 }
          schtasks /Delete /TN 'Unio Runner org_ci' /F
          if ($LASTEXITCODE) { exit 1 }

      - name: Run install.ps1 in Windows PowerShell and PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($shell in 'powershell', 'pwsh') {
            $out = & $shell -NoProfile -NonInteractive -Command '& ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Runner -Workspace org_a-b' 2>&1 | Out-String
            Write-Host "${shell}: $out"
            if ($out -notmatch 'org_ seguido de letras') { throw "$shell did not run install.ps1" }
          }

      - name: Run install.ps1's plugin mode through Git's sh
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The clone install.ps1 keeps, made from this checkout, so install.sh
          # is this branch's. It stops at the hidden prompt: no terminal here.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'localappdata'
          git clone --quiet . (Join-Path $env:LOCALAPPDATA 'unio\agent')
          foreach ($shell in 'powershell', 'pwsh') {
            $out = & $shell -NoProfile -NonInteractive -Command '& ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Workspace org_ci -Renew' 2>&1 | Out-String
            Write-Host "${shell}: $out"
            if ($out -notmatch 'precisa de um terminal') { throw "$shell did not reach install.sh through Git's sh" }
          }
          # A clone already where install.sh cloned before stays the one in
          # use, and the unio command on the Path is that clone's.
          $env:HOME = Join-Path $env:RUNNER_TEMP 'home'
          $legacy = Join-Path $env:HOME '.local\share\unio\agent'
          git clone --quiet . $legacy
          $out = & pwsh -NoProfile -NonInteractive -Command '& ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Workspace org_ci -Renew' 2>&1 | Out-String -Width 4096
          Write-Host "old clone: $out"
          if ($out -notmatch [regex]::Escape((Join-Path $legacy 'bin'))) { throw "install.ps1 did not use the clone at the old place" }

      - name: Run bin/unio.cmd from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $connect = & .\bin\unio.cmd help connect | Out-String
          if ($LASTEXITCODE -or $connect -notmatch '^Uso: unio connect') { throw "unio.cmd help connect: $connect" }
          & .\bin\unio.cmd bogus
          if ($LASTEXITCODE -ne 2) { throw "unio.cmd bogus exited $LASTEXITCODE" }
          $help = & .\bin\unio.cmd help | Out-String
          if ($LASTEXITCODE -or $help -notmatch '(?m)^  runner ') { throw "unio.cmd help: $help" }
          $version = (& .\bin\unio.cmd --version | Out-String).Trim()
          if ($version -ne (Get-Content -Raw runner\VERSION).Trim()) { throw "unio.cmd --version: $version" }
          & .\bin\unio.cmd runner --help
          if ($LASTEXITCODE) { throw "unio.cmd runner --help exited $LASTEXITCODE" }

      # Last, since it leaves a folder on this machine's user Path.
      - name: Put a folder on the user's Path once, as install.ps1 -Runner does
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ([scriptblock]::Create((Get-Content -Raw install.ps1)))
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $before = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $kind = if ($null -ne $key.GetValue('Path')) { $key.GetValueKind('Path') } else { 'ExpandString' }
          $folder = Join-Path $env:RUNNER_TEMP 'unio bin'
          if (-not (Add-UserPath $folder)) { throw 'the first call did not add the folder' }
          if (Add-UserPath "$folder\") { throw 'the second call added it again' }
          $after = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $expected = (@($before.TrimEnd(';'), $folder) | Where-Object { $_ }) -join ';'
          if ($after -ne $expected) { throw "the user's Path is now: $after" }
          if ($key.GetValueKind('Path') -ne $kind) { throw "the user's Path became $($key.GetValueKind('Path'))" }
          if (-not (($env:Path -split ';') -contains $folder)) { throw "this session's Path lacks $folder" }
